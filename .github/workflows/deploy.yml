name: Deploy Production

on:
  release:
    types: [published]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: [test]
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: api

    steps:
      - name: Fetch Repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          API_VERSION: ${{ github.event.release.tag_name }}
        run: |
          docker build -t $ECR_REGISTRY/rabi-food-core:$API_VERSION .
          docker tag $ECR_REGISTRY/rabi-food-core:$API_VERSION $ECR_REGISTRY/rabi-food-core:latest
          docker push $ECR_REGISTRY/rabi-food-core:$API_VERSION
          docker push $ECR_REGISTRY/rabi-food-core:latest

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Run Migrations
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST_PRODUCTION }}
          DATABASE_USER: ${{ secrets.DATABASE_USER_PRODUCTION }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD_PRODUCTION }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT_PRODUCTION }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME_PRODUCTION }}
        run: |
          go run github.com/pressly/goose/v3/cmd/goose@v3.27.0 \
            -dir libs/database/migrations postgres \
            "host=${DATABASE_HOST} user=${DATABASE_USER} password=${DATABASE_PASSWORD} port=${DATABASE_PORT} dbname=${DATABASE_NAME}" \
            up

      - name: Update ECS task definition
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          API_VERSION: ${{ github.event.release.tag_name }}
        run: |
          TASK_DEF=$(aws ecs describe-task-definition --task-definition rabi-food-api --query 'taskDefinition' --output json)
          NEW_TASK_DEF=$(echo $TASK_DEF | jq \
            --arg IMAGE "$ECR_REGISTRY/rabi-food-core:$API_VERSION" \
            --arg VERSION "$API_VERSION" \
            '.containerDefinitions[0].image = $IMAGE |
             .containerDefinitions[0].environment += [{"name":"API_VERSION","value":$VERSION}] |
             del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.placementConstraints,.compatibilities,.registeredAt,.registeredBy)')
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster rabi-food --service rabi-food-api --task-definition $NEW_ARN

      # The dashboards' login: analytics_reader comes from the migrations, the password from Terraform's secret.
      # After the ECS update, so a failure here never holds back the release.
      - name: Grant the dashboards' database user
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST_PRODUCTION }}
          DATABASE_USER: ${{ secrets.DATABASE_USER_PRODUCTION }}
          PGPASSWORD: ${{ secrets.DATABASE_PASSWORD_PRODUCTION }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT_PRODUCTION }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME_PRODUCTION }}
        run: |
          READER_PASSWORD=$(aws secretsmanager get-secret-value --secret-id rabi-food/grafana-reader-password \
            --query SecretString --output text)
          echo "::add-mask::$READER_PASSWORD"
          psql "host=${DATABASE_HOST} port=${DATABASE_PORT} user=${DATABASE_USER} dbname=${DATABASE_NAME} sslmode=require" \
            -v ON_ERROR_STOP=1 -v reader_password="$READER_PASSWORD" <<'SQL'
          SELECT 'CREATE ROLE grafana_reader LOGIN'
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'grafana_reader') \gexec
          SELECT format('ALTER ROLE grafana_reader WITH LOGIN PASSWORD %L', :'reader_password') \gexec
          ALTER ROLE grafana_reader CONNECTION LIMIT 3;
          ALTER ROLE grafana_reader SET statement_timeout = '30s';
          GRANT analytics_reader TO grafana_reader;
          SQL
