name: Test

on:
  pull_request:
    branches:
      - main
      - dev
      - staging
  workflow_call:

jobs:
  test:
    # Runs directly on the runner (not inside `container:`) so testcontainers can reach the Docker daemon.
    # No service containers or secrets: each test package starts its own Postgres + GoTrue.
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Fetch Repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Run Tests
        run: go run gotest.tools/gotestsum@v1.13.0 --format testname -- ./...
